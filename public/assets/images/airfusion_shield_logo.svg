<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Premium Dark Obsidian / Evergreen Tile Gradient -->
    <linearGradient id="leafPlateBg" x1="10" y1="8" x2="90" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A201E"/>
      <stop offset="50%" stop-color="#131816"/>
      <stop offset="100%" stop-color="#0C100F"/>
    </linearGradient>

    <!-- Luxury Precision Bio-Rim -->
    <linearGradient id="leafPlateRim" x1="4" y1="4" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Organic Stem Gradient -->
    <linearGradient id="stemGrad" x1="24" y1="82" x2="52" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D7A38"/>
      <stop offset="30%" stop-color="#4CAE4F"/>
      <stop offset="75%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>

    <!-- Leaf 1 (Bottom Right) Gradient -->
    <linearGradient id="leaf1Grad" x1="44" y1="65" x2="80" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="40%" stop-color="#4CAF50"/>
      <stop offset="85%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>

    <!-- Leaf 2 (Mid Right) Gradient -->
    <linearGradient id="leaf2Grad" x1="48" y1="52" x2="79" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="35%" stop-color="#43A047"/>
      <stop offset="75%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>

    <!-- Leaf 3 (Top Right) Gradient -->
    <linearGradient id="leaf3Grad" x1="50" y1="41" x2="73" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="40%" stop-color="#4CAF50"/>
      <stop offset="80%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#9CCC65"/>
    </linearGradient>

    <!-- Leaf 4 (Top Center) Gradient -->
    <linearGradient id="leaf4Grad" x1="46" y1="45" x2="44" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="30%" stop-color="#43A047"/>
      <stop offset="70%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>

    <!-- Leaf 5 (Left) Gradient -->
    <linearGradient id="leaf5Grad" x1="38" y1="61" x2="19" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="35%" stop-color="#43A047"/>
      <stop offset="75%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>

    <!-- Gloss Highlight Filter -->
    <filter id="glossBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- 1. Luxury Squircle Tile Canvas (Matches User Dark Background #17181C) -->
  <rect x="3.5" y="3.5" width="93" height="93" rx="26" fill="url(#leafPlateBg)" stroke="url(#leafPlateRim)" stroke-width="1.6"/>

  <!-- Subtle Specular Inner Rim Glow -->
  <rect x="5.5" y="5.5" width="89" height="89" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>

  <!-- 2. Central Botanical Sprig (Faithful to User Reference Motif) -->
  <g id="botanicalSprig">
    <!-- Curved Central Stem -->
    <path d="M 25 80 C 26 82 28.5 82.5 30 81 C 32 78.5 35 72 38.5 64.5 C 41.5 58 45 50.5 48.5 42.5 C 49.5 40 51 40 51.5 41.5 C 50.5 45 47 53 43.5 60.5 C 40 68 36 75.5 32 79.5 C 29.5 82 26 81.5 25 80 Z" 
          fill="url(#stemGrad)"/>

    <!-- Stem Base Joint Node Accent -->
    <ellipse cx="27" cy="80.5" rx="2.4" ry="1.4" transform="rotate(-30 27 80.5)" fill="#205E28"/>

    <!-- Leaf 5: Broad Left Leaf (Pointing Up-Left ~110°) -->
    <path d="M 38 60 C 33 58 26 55.5 22.5 48.5 C 19 41.5 19.5 34.5 20 32 C 21.5 34.5 25.5 37 30 38.5 C 35 40 38 46 38.5 53 C 38.7 56 38.5 58.5 38 60 Z" 
          fill="url(#leaf5Grad)"/>
    <path d="M 23 37 C 24.5 42 27 47 31 50" 
          stroke="#B4F588" stroke-width="1.8" stroke-linecap="round" opacity="0.85" filter="url(#glossBlur)"/>

    <!-- Leaf 4: Top Center Leaf (Pointing Upright ~78°) -->
    <path d="M 45 44 C 42 41 39 36 39.5 30 C 40 25.5 42.5 24 44 23.5 C 45.5 24.5 48.5 28 50 33 C 51.5 38 49 42 47 43.5 Z" 
          fill="url(#leaf4Grad)"/>
    <path d="M 43.5 26.5 C 45.5 30 46.5 34.5 45.5 39" 
          stroke="#B4F588" stroke-width="1.6" stroke-linecap="round" opacity="0.85" filter="url(#glossBlur)"/>

    <!-- Leaf 3: Top Right Leaf (Pointing Up-Right ~42°) -->
    <path d="M 50.5 41 C 52 36 57 28 64 23.5 C 69 20.5 72 20.5 73 21 C 72 23.5 69 29.5 64 34.5 C 59.5 39 54.5 40.5 50.5 41 Z" 
          fill="url(#leaf3Grad)"/>
    <path d="M 60 25 C 65 23 68.5 22.5 71 22" 
          stroke="#D4FC79" stroke-width="1.8" stroke-linecap="round" opacity="0.9" filter="url(#glossBlur)"/>

    <!-- Leaf 2: Middle Right Leaf (Pointing Right ~12°) -->
    <path d="M 47 52.5 C 50 49.5 57 46 65 45.5 C 72 45 77 47 78.5 47.5 C 76.5 49.5 71.5 54 64 56 C 57 58 50.5 55.5 47 52.5 Z" 
          fill="url(#leaf2Grad)"/>
    <path d="M 56 48 C 64 47 71 47.5 76 48" 
          stroke="#B4F588" stroke-width="1.8" stroke-linecap="round" opacity="0.85" filter="url(#glossBlur)"/>

    <!-- Leaf 1: Bottom Right Leaf (Pointing Down-Right ~-18°) -->
    <path d="M 43 66 C 47 63 56 62 65 64 C 73 66 77.5 68.5 79.5 69 C 76.5 71.5 70 76 62 76.5 C 54 77 47 72 43 66 Z" 
          fill="url(#leaf1Grad)"/>
    <path d="M 52 64 C 61 64 70 66.5 76.5 69" 
          stroke="#B4F588" stroke-width="1.9" stroke-linecap="round" opacity="0.85" filter="url(#glossBlur)"/>
  </g>
</svg>