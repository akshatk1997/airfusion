<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="afBgGrad" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1E2E"/>
      <stop offset="45%" stop-color="#16273A"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>

    <linearGradient id="afBorderGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#FF6845"/>
      <stop offset="100%" stop-color="#FF9E7D"/>
    </linearGradient>

    <linearGradient id="afAirWing" x1="16" y1="16" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="afFusionWing" x1="48" y1="16" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="25%" stop-color="#FF6845"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <radialGradient id="afNexusCore" cx="32" cy="31.5" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E0F2FE" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="afBevel" x1="20" y1="7" x2="44" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- 1. Master Aerodynamic Defense Shield Baseplate -->
  <path d="M 32 6.5 C 43.5 6.5 52 10.5 52 23 C 52 40 40 52.5 32 57.5 C 24 52.5 12 40 12 23 C 12 10.5 20.5 6.5 32 6.5 Z" 
        fill="url(#afBgGrad)" 
        stroke="url(#afBorderGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- 2. Precision Inner Bevel Rim -->
  <path d="M 32 10.5 C 41 10.5 48 13.8 48 23.5 C 48 37.8 38.5 48.5 32 53 C 25.5 48.5 16 37.8 16 23.5 C 16 13.8 23 10.5 32 10.5 Z" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.12)" 
        stroke-width="1.2"/>

  <!-- 3. Top Polished Edge Specular Glint -->
  <path d="M 22 8.5 C 27 7.5 37 7.5 42 8.5" 
        stroke="url(#afBevel)" 
        stroke-width="1.4" 
        stroke-linecap="round"/>

  <!-- 4. Left Aerodynamic Air Current (Atmospheric Troposphere Flow) -->
  <path d="M 19 21.5 C 18.5 32.5 24 40.5 32 45.5 C 27.5 39.8 24.2 33 25.4 24.8 C 26.2 20.2 29 17.6 32 16.5 C 26 16.3 19.8 18.6 19 21.5 Z" 
        fill="url(#afAirWing)"/>

  <!-- 5. Right Aerodynamic Fusion Current (Kinetic Solar Fusion Flow) -->
  <path d="M 45 21.5 C 45.5 32.5 40 40.5 32 45.5 C 36.5 39.8 39.8 33 38.6 24.8 C 37.8 20.2 35 17.6 32 16.5 C 38 16.3 44.2 18.6 45 21.5 Z" 
        fill="url(#afFusionWing)"/>

  <!-- 6. Intersecting Laminar Core Air-Fusion Wave -->
  <path d="M 32 18.5 C 29.5 23.8 29.2 29.8 32 34.5 C 34.8 29.8 34.5 23.8 32 18.5 Z" 
        fill="#FFFFFF" 
        fill-opacity="0.32"/>

  <!-- 7. Ambient Fusion Plasma Core Halo -->
  <circle cx="32" cy="31.5" r="7.5" fill="url(#afNexusCore)"/>

  <!-- 8. Four-Point Precision Stellar Fusion Diamond (Core Metrology Nexus) -->
  <path d="M 32 24.5 L 34.2 29.8 L 39.5 31.5 L 34.2 33.2 L 32 38.5 L 29.8 33.2 L 24.5 31.5 L 29.8 29.8 Z" 
        fill="#FFFFFF" 
        stroke="#BAE6FD" 
        stroke-width="0.4"/>

  <!-- 9. Micro Diamond Highlight Point -->
  <circle cx="32" cy="31.5" r="1.6" fill="#FFFFFF"/>
</svg>